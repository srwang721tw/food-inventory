<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PantryAI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#30b0c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PantryAI">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ── CSS Variables ── */
    :root {
      --bg:      #f2f2f7;
      --card:    #ffffff;
      --primary: #30b0c7;
      --danger:  #ff3b30;
      --text:    #1c1c1e;
      --text2:   #636366;
      --text3:   #aeaeb2;
      --border:  #e5e5ea;
      --shadow:  0 2px 14px rgba(0,0,0,0.07);
      --radius:  16px;
      --rsm:     10px;
    }
    .dark {
      --bg:      #1c1c1e;
      --card:    #2c2c2e;
      --primary: #30b0c7;
      --danger:  #ff453a;
      --text:    #f2f2f7;
      --text2:   rgba(235,235,245,0.6);
      --text3:   rgba(235,235,245,0.3);
      --border:  #38383a;
      --shadow:  0 2px 14px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { color-scheme: light; }
    html.dark { color-scheme: dark; }

    body {
      font-family: 'Noto Sans TC', -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s;
      padding: 16px;
    }

    /* ── Theme toggle ── */
    .theme-btn {
      position: fixed; top: 16px; right: 16px;
      width: 34px; height: 34px;
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 50%; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      z-index: 10;
    }
    .theme-btn:active { opacity: 0.7; }

    /* ── Login card ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 36px 28px 32px;
      width: min(390px, 100%);
      box-shadow: var(--shadow);
      transition: background 0.2s, box-shadow 0.2s;
    }

    .logo {
      text-align: center;
      margin-bottom: 6px;
      font-size: 52px;
      line-height: 1;
    }
    .app-name {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }
    .app-sub {
      text-align: center;
      font-size: 12px;
      color: var(--text3);
      margin-bottom: 28px;
    }

    /* ── Form ── */
    .fg { margin-bottom: 14px; }
    .fg label {
      display: block; font-size: 12px; font-weight: 500;
      color: var(--text2); margin-bottom: 5px;
    }
    .fg input {
      width: 100%; padding: 11px 13px;
      border-radius: var(--rsm);
      border: 1.5px solid var(--border);
      font-size: 15px; font-family: inherit;
      color: var(--text); background: var(--bg);
      outline: none;
      transition: border-color 0.14s, background 0.2s, color 0.2s;
    }
    .fg input:focus { border-color: var(--primary); }
    .fg input::placeholder { color: var(--text3); }
    /* Password show/hide wrapper */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 42px; width: 100%; box-sizing: border-box; }
    .pw-eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text3); padding: 4px; display: flex; align-items: center; }
    .pw-eye svg { display: block; }

    /* ── Error message ── */
    .err-msg {
      background: rgba(255,59,48,0.1);
      border: 1px solid rgba(255,59,48,0.25);
      border-radius: var(--rsm);
      color: var(--danger);
      font-size: 13px; font-weight: 500;
      padding: 9px 13px;
      margin-bottom: 14px;
      display: none;
    }
    .err-msg.show { display: block; }

    /* ── Button ── */
    .btn-login {
      width: 100%; padding: 13px;
      border: none; border-radius: var(--rsm);
      font-size: 15px; font-weight: 600;
      font-family: inherit;
      background: var(--primary); color: #fff;
      cursor: pointer;
      transition: opacity 0.12s, transform 0.1s;
      margin-top: 6px;
    }
    .btn-login:active { opacity: 0.82; transform: scale(0.98); }

    /* ── Landscape adjustments ── */
    @media (orientation: landscape) and (max-height: 500px) {
      .card { padding: 20px 28px 20px; }
      .logo { font-size: 38px; margin-bottom: 4px; }
      .app-sub { margin-bottom: 16px; }
    }
    /* PWA standalone: iOS home-indicator safe area */
    @media (display-mode: standalone) {
      body { padding-bottom: env(safe-area-inset-bottom, 0px); }
    }
  </style>
</head>
<body>

<button class="theme-btn" id="themeBtn" onclick="cycleTheme()" title="切換主題"></button>

<div class="card">
  <div class="logo">🍱</div>
  <div class="app-name">PantryAI</div>
  <div class="app-sub">您的冰箱守門員</div>

  <div class="err-msg{% if error %} show{% endif %}" id="errMsg">{% if error %}{{ error }}{% endif %}</div>

  <form id="loginForm">
    <div class="fg">
      <label for="username">帳號</label>
      <input type="text" id="username" name="username" placeholder="請輸入帳號"
             autocomplete="username" autocapitalize="none" spellcheck="false"
             required autofocus>
    </div>
    <div class="fg">
      <label for="password">密碼</label>
      <div class="pw-wrap">
        <input type="password" id="password" name="password" placeholder="請輸入密碼"
               autocomplete="current-password" required>
        <button class="pw-eye" type="button" onclick="togglePw('password',this)" aria-label="顯示密碼"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <button class="btn-login" type="submit" id="loginBtn">登入</button>
  </form>
</div>

<footer style="position:fixed;bottom:0;left:0;right:0;text-align:center;padding:12px;font-size:11px;color:var(--text3)">
  © 2026 <a href="https://github.com/srwang721tw" target="_blank" style="color:var(--text3);text-decoration:none">srwang721tw</a>
</footer>

<script>
const _EYE_OPEN = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const _EYE_OFF  = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.innerHTML = inp.type === 'password' ? _EYE_OPEN : _EYE_OFF;
}
// ── Theme ─────────────────────────────────────────────────────
const THEMES = ['system', 'light', 'dark'];
const ICONS  = { system: '🌓', light: '☀️', dark: '🌙' };
let currentTheme = localStorage.getItem('theme') || 'system';

function applyTheme(t) {
  const dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
  document.getElementById('themeBtn').textContent = ICONS[t];
}
function cycleTheme() {
  const idx = THEMES.indexOf(currentTheme);
  currentTheme = THEMES[(idx + 1) % THEMES.length];
  localStorage.setItem('theme', currentTheme);
  applyTheme(currentTheme);
}
applyTheme(currentTheme);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (currentTheme === 'system') applyTheme('system');
});

// ── Fetch-based login (keeps iOS standalone WebView in-app) ────────────────
const errMsg = document.getElementById('errMsg');
function showErr(msg) {
  errMsg.textContent = msg;
  errMsg.classList.add('show');
}
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = '登入中…';
  errMsg.classList.remove('show');
  try {
    const params = new URLSearchParams(new FormData(e.target));
    const r = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params.toString(),
      redirect: 'follow',
    });
    if (r.redirected || r.url.endsWith('/') || !r.url.includes('/login')) {
      // Successful login — server redirected away from /login
      window.location.href = r.url;
    } else {
      // Still on login page — parse error via DOMParser (avoids self-matching regex)
      const html = await r.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const errEl = doc.getElementById('errMsg');
      showErr((errEl && errEl.textContent.trim()) || '帳號或密碼錯誤');
      btn.disabled = false;
      btn.textContent = '登入';
    }
  } catch {
    showErr('網路連線錯誤，請稍後再試');
    btn.disabled = false;
    btn.textContent = '登入';
  }
});

// ── Service Worker ─────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
